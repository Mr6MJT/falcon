# Coolify/Traefik overlay — routes Falcon through the existing `coolify-proxy` (Traefik) the
# same way Coolify-managed sites are, via container labels on the shared `coolify` network.
# Adds only new Traefik routers (falcon-*) — it cannot affect other sites' routes.
#
#   docker compose --env-file infra/.env \
#     -f infra/compose.prod.yaml -f infra/compose.coolify.yaml up -d
#
# IMPORTANT: the API + web join the shared `coolify` network for ingress, where other stacks
# also have containers named `postgres` / `redis`. To avoid resolving to the WRONG database,
# Falcon's postgres/redis get unique aliases (falcon-postgres / falcon-redis) and the API is
# pointed at those. worker/beat/bootstrap stay on the private network and are unaffected.
#
# Requires DNS: falcon.orvex.services -> server IP, DNS-only, so Traefik's Let's Encrypt
# (certresolver "letsencrypt") HTTP-01 challenge reaches the origin.
networks:
  coolify:
    external: true

services:
  caddy:
    profiles: ["disabled"]

  postgres:
    networks:
      default:
        aliases: [falcon-postgres]

  redis:
    networks:
      default:
        aliases: [falcon-redis]

  web:
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - "traefik.http.routers.falcon-web.rule=Host(`falcon.orvex.services`)"
      - traefik.http.routers.falcon-web.entrypoints=https
      - traefik.http.routers.falcon-web.tls=true
      - traefik.http.routers.falcon-web.tls.certresolver=letsencrypt
      - traefik.http.routers.falcon-web.service=falcon-web
      - traefik.http.services.falcon-web.loadbalancer.server.port=3000
      - "traefik.http.routers.falcon-web-http.rule=Host(`falcon.orvex.services`)"
      - traefik.http.routers.falcon-web-http.entrypoints=http
      - traefik.http.routers.falcon-web-http.service=falcon-web
      - traefik.http.routers.falcon-web-http.middlewares=falcon-redirect
      - traefik.http.middlewares.falcon-redirect.redirectscheme.scheme=https

  api:
    networks:
      - default
      - coolify
    # Point at the unambiguous aliases (see note above). Other env keys merge from prod.
    environment:
      ORVEX_DATABASE_URL: "postgresql+psycopg://orvex_app:${ORVEX_DB_PASSWORD}@falcon-postgres:5432/orvex"
      ORVEX_AUTH_DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@falcon-postgres:5432/orvex"
      ORVEX_REDIS_URL: "redis://falcon-redis:6379/0"
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - "traefik.http.routers.falcon-api.rule=Host(`falcon.orvex.services`) && PathPrefix(`/api`)"
      - traefik.http.routers.falcon-api.entrypoints=https
      - traefik.http.routers.falcon-api.tls=true
      - traefik.http.routers.falcon-api.tls.certresolver=letsencrypt
      - traefik.http.routers.falcon-api.priority=100
      - traefik.http.routers.falcon-api.service=falcon-api
      - traefik.http.routers.falcon-api.middlewares=falcon-api-strip
      - traefik.http.middlewares.falcon-api-strip.stripprefix.prefixes=/api
      - traefik.http.services.falcon-api.loadbalancer.server.port=8000
