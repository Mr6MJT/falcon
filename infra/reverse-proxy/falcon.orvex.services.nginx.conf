# nginx vhost for falcon.orvex.services — routes the subdomain to the loopback-published
# Falcon containers (see infra/compose.sharedhost.yaml). Put in /etc/nginx/sites-available/,
# symlink into sites-enabled/, then: nginx -t && systemctl reload nginx.
# TLS: certbot --nginx -d falcon.orvex.services   (uses your existing Let's Encrypt setup)

server {
    listen 80;
    server_name falcon.orvex.services;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name falcon.orvex.services;

    # ssl_certificate     /etc/letsencrypt/live/falcon.orvex.services/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/falcon.orvex.services/privkey.pem;

    # API — strip the /api prefix (backend serves from root). Includes WebSocket live progress.
    location /api/ {
        proxy_pass http://127.0.0.1:8096/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
    }

    # Web (Next.js frontend)
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
